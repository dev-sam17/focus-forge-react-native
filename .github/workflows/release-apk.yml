name: Release APK
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        run: npm install -g pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - run: pnpm install --frozen-lockfile
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
      - name: Configure Gradle JVM memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
      - name: Build APK Locally
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: true
          EAS_LOCAL_BUILD_SKIP_CLEANUP: 1
        run: eas build --platform android --profile production --non-interactive --local --output ./focus-forge.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./focus-forge.apk
          name: "Focus Forge ${{ github.ref_name }}"
          body: |
            ## Focus Forge ${{ github.ref_name }}

            ### Install
            Download `focus-forge.apk` and install on your Android device.

            ### What's Changed
            See commit history for changes since last release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
