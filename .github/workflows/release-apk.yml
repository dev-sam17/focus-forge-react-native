name: Release APK
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      is_major_or_minor: ${{ steps.check.outputs.is_major_or_minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check version bump
        id: check
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          # Get the previous tag by sorting version strings
          PREV_TAG=$(git tag -l | sort -V | grep -B 1 "^$CURRENT_TAG$" | head -n 1)
          
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            echo "No previous tag found, assuming major/minor bump."
            echo "is_major_or_minor=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Remove 'v' prefix if present
          CURR_VER=${CURRENT_TAG#v}
          PREV_VER=${PREV_TAG#v}
          
          CURR_MAJOR=$(echo $CURR_VER | cut -d. -f1)
          CURR_MINOR=$(echo $CURR_VER | cut -d. -f2)
          
          PREV_MAJOR=$(echo $PREV_VER | cut -d. -f1)
          PREV_MINOR=$(echo $PREV_VER | cut -d. -f2)
          
          if [ "$CURR_MAJOR" != "$PREV_MAJOR" ] || [ "$CURR_MINOR" != "$PREV_MINOR" ]; then
            echo "is_major_or_minor=true" >> $GITHUB_OUTPUT
          else
            echo "is_major_or_minor=false" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.is_major_or_minor == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - run: pnpm install --frozen-lockfile
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Configure Gradle JVM memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
      - name: Build APK Locally
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: true
          EAS_LOCAL_BUILD_SKIP_CLEANUP: 1
        run: eas build --platform android --profile production --non-interactive --local --output ./focus-forge.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./focus-forge.apk
          name: "Focus Forge ${{ github.ref_name }}"
          body: |
            ## Focus Forge ${{ github.ref_name }}

            ### Install
            Download `focus-forge.apk` and install on your Android device.

            ### What's Changed
            See commit history for changes since last release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
